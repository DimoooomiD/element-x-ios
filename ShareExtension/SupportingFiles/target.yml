name: ShareExtension

schemes:
  ShareExtension:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ShareExtension:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      askForAppToLaunch: true
      config: Debug
      debugEnabled: false
      disableMainThreadChecker: false
      launchAutomaticallySubstyle: 2
    test:
      config: Debug
      disableMainThreadChecker: false

targets:
  ShareExtension:
    type: app-extension
    platform: iOS

    dependencies:
      - package: MatrixRustSDK
      - package: Compound
      - package: Collections
      - package: KeychainAccess

    preBuildScripts:
    - name: 🔧 Configure Premium Capabilities
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      inputPaths:
        - $(SRCROOT)/ShareExtension/SupportingFiles/ShareExtension.entitlements
      outputPaths:
        - $(SRCROOT)/ShareExtension/SupportingFiles/ShareExtension.entitlements
      script: |
        ENTITLEMENTS_FILE="$SRCROOT/ShareExtension/SupportingFiles/ShareExtension.entitlements"
        ENABLE_PREMIUM="${ENABLE_PREMIUM_CAPABILITIES:-YES}"
        
        # Normalize the value (handle YES/NO, 1/0, true/false, etc.)
        case "$ENABLE_PREMIUM" in
          YES|yes|1|TRUE|true|True)
            ENABLE_PREMIUM_VALUE=true
            ;;
          *)
            ENABLE_PREMIUM_VALUE=false
            ;;
        esac
        
        if [ "$ENABLE_PREMIUM_VALUE" = "false" ]; then
            echo "⚠️  ShareExtension: Updating Application Group for personal development team"
            
            # Update Application Group to use team-specific format for personal development teams
            # Personal teams can't use group.io.element, they need group.<TEAM_ID>.element
            if [ -n "$DEVELOPMENT_TEAM" ]; then
                TEAM_APP_GROUP="group.$DEVELOPMENT_TEAM.element"
                echo "   Updating Application Group to team-specific format: $TEAM_APP_GROUP"
                /usr/libexec/PlistBuddy -c "Set :com.apple.security.application-groups:0 $TEAM_APP_GROUP" "$ENTITLEMENTS_FILE" 2>/dev/null || \
                /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string $TEAM_APP_GROUP" "$ENTITLEMENTS_FILE" 2>/dev/null || true
            fi
        fi

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        productionAppName: $(PRODUCTION_APP_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareExtensionViewController
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10

    entitlements:
      path: ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_DISPLAY_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.shareextension
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ENABLE_PREMIUM_CAPABILITIES: $(ENABLE_PREMIUM_CAPABILITIES)

    sources:
    - path: ../Sources
    - path: ../SupportingFiles
    - path: ../../Lingugram/Sources/ShareExtension
    - path: ../../Lingugram/Sources/AppHooks/AppHooks.swift
    - path: ../../Lingugram/Sources/AppHooks/Hooks/TracingHook.swift
    - path: ../../Lingugram/Sources/AppHooks/Hooks/ClientBuilderHook.swift
    - path: ../../Lingugram/Sources/AppHooks/Hooks/RemoteSettingsHook.swift
    - path: ../../Secrets/Secrets.swift
    - path: ../../Lingugram/Sources/Application/Settings
    - path: ../../Lingugram/Sources/Application/TargetConfiguration.swift
    - path: ../../Lingugram/Sources/Services/Keychain/KeychainController.swift
    - path: ../../Lingugram/Sources/Services/Keychain/KeychainControllerProtocol.swift
    - path: ../../Lingugram/Sources/Services/UserSession/RestorationToken.swift
    - path: ../../Lingugram/Sources/Services/UserSession/SessionDirectories.swift
    - path: ../../Lingugram/Sources/Other/Extensions/Bundle.swift
    - path: ../../Lingugram/Sources/Other/Extensions/Dictionary.swift
    - path: ../../Lingugram/Sources/Other/Extensions/FileManager.swift
    - path: ../../Lingugram/Sources/Other/Extensions/NSItemProvider.swift
    - path: ../../Lingugram/Sources/Other/Extensions/ProcessInfo.swift
    - path: ../../Lingugram/Sources/Other/Extensions/UIView.swift
    - path: ../../Lingugram/Sources/Other/Extensions/URL.swift
    - path: ../../Lingugram/Sources/Other/InfoPlistReader.swift
    - path: ../../Lingugram/Sources/Other/CurrentValuePublisher.swift
    - path: ../../Lingugram/Sources/Other/Logging
    - path: ../../Lingugram/Sources/UITests/UITestsScreenIdentifier.swift
